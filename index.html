<title>Metas do Dia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita, como um caderno de bolso — semana no topo, lista do dia, formulário no fim */
:root {
  --bg: #eef1ec;
  --surface: #fbfcfa;
  --fg: #1d2620;
  --muted: #5f6b63;
  --line: #d5dcd4;
  --accent: #2f6b4a;
  --accent-soft: #dbe9df;
  --on-accent: #f4faf6;
  --amber: #b06a12;
  --danger: #a33a2c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --surface: #1b221e; --fg: #e4ebe5; --muted: #98a59c; --line: #2d3731;
    --accent: #6fbf8f; --accent-soft: #23362a; --on-accent: #0f1a13; --amber: #e3a54f; --danger: #e78473;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --surface: #1b221e; --fg: #e4ebe5; --muted: #98a59c; --line: #2d3731;
  --accent: #6fbf8f; --accent-soft: #23362a; --on-accent: #0f1a13; --amber: #e3a54f; --danger: #e78473;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 560px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 22px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-size: clamp(28px, 7vw, 38px); font-weight: 700; line-height: 1.05; }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px var(--display); font-variant-numeric: tabular-nums; }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px; position: relative; overflow: hidden;
}
.day .wd { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.day .dn { font: 600 17px var(--display); font-variant-numeric: tabular-nums; position: relative; }
.day .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent-soft); transition: height .3s ease; }
.day .wd, .day .dn { position: relative; }
.day.full .fill { background: var(--accent); }
.day.full .wd, .day.full .dn { color: var(--on-accent); }
.day[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }

.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.goal {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
}
.check {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.check svg { width: 18px; height: 18px; stroke: var(--on-accent); stroke-width: 3; fill: none; opacity: 0; }
.goal.done .check { background: var(--accent); border-color: var(--accent); }
.goal.done .check svg { opacity: 1; }
.goal .info { min-width: 0; display: grid; gap: 6px; }
.goal .name { font-weight: 600; overflow-wrap: anywhere; }
.goal.done .name { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .streak { color: var(--amber); font-weight: 600; }
.progress { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.badge { font-size: 12px; font-weight: 600; color: var(--on-accent); background: var(--accent); padding: 1px 8px; border-radius: 99px; }
.remove { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 6px; border-radius: 8px; }
.remove:hover { color: var(--danger); }
.remove.armed { color: var(--danger); font-weight: 600; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 12px; color: var(--muted); }
.empty strong { color: var(--fg); font-family: var(--display); font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.chip:hover { border-color: var(--accent); }

form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
form h2 { font-size: 19px; font-weight: 700; }
.row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.status { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.5em; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; } .day .dn { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <div>
      <div class="eyebrow" id="dateLabel">Hoje</div>
      <h1 id="dayTitle">Metas do dia</h1>
    </div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="34"></circle><circle class="bar" id="ringBar" cx="40" cy="40" r="34"></circle></svg>
      <span id="ringText">0/0</span>
    </div>
  </header>

  <nav class="week" id="week" aria-label="Últimos 7 dias"></nav>

  <section aria-labelledby="dayTitle">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <strong>Nenhum objetivo ainda</strong>
      <span>Cadastre o que você quer cumprir todo dia e defina quantos dias são a meta. Para começar rápido, toque numa sugestão:</span>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <form id="form" autocomplete="off">
    <h2>Novo objetivo</h2>
    <div class="row">
      <label>Objetivo
        <input id="goalName" required maxlength="80" placeholder="Ex.: Ler 10 páginas">
      </label>
      <label>Meta (dias)
        <input id="goalTarget" type="number" min="1" max="3650" value="30" inputmode="numeric">
      </label>
    </div>
    <button class="primary" type="submit">Adicionar objetivo</button>
    <p class="hint">A meta é cumprida quando você marcar o objetivo nesse número de dias.</p>
  </form>

  <div class="status" id="status" role="status"></div>
</main>

<script>
const WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SUGGESTIONS = [["Beber 2 L de água", 30], ["Ler 10 páginas", 30], ["Treinar 30 min", 21], ["Dormir antes das 23h", 14]];
const RING = 2 * Math.PI * 34;

let state = { goals: [], days: {} };
let selected = keyOf(new Date());
let store = null;

function keyOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dateOf(key) { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); }
function shift(key, n) { const d = dateOf(key); d.setDate(d.getDate() + n); return keyOf(d); }
function uid() { return Math.random().toString(36).slice(2, 10); }

function doneOn(key) { return state.days[key] || []; }
function isDone(goalId, key) { return doneOn(key).includes(goalId); }
function totalDays(goalId) { return Object.values(state.days).filter(ids => ids.includes(goalId)).length; }
function streak(goalId) {
  let key = keyOf(new Date()), n = 0;
  if (!isDone(goalId, key)) key = shift(key, -1);
  while (isDone(goalId, key)) { n++; key = shift(key, -1); }
  return n;
}
function goalsFor(key) { return state.goals.filter(g => g.createdAt <= key); }

/* ---------- render ---------- */
function render() {
  const today = keyOf(new Date());
  const d = dateOf(selected);
  document.getElementById("dateLabel").textContent =
    `${WEEKDAYS[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  document.getElementById("dayTitle").textContent =
    selected === today ? "Metas de hoje" : selected === shift(today, -1) ? "Metas de ontem" : "Metas do dia";

  const goals = goalsFor(selected);
  const done = goals.filter(g => isDone(g.id, selected)).length;
  document.getElementById("ringText").textContent = `${done}/${goals.length}`;
  const bar = document.getElementById("ringBar");
  bar.style.strokeDasharray = RING;
  bar.style.strokeDashoffset = RING * (1 - (goals.length ? done / goals.length : 0));

  const week = document.getElementById("week");
  week.replaceChildren();
  for (let i = 6; i >= 0; i--) {
    const key = shift(today, -i), dd = dateOf(key), gs = goalsFor(key);
    const ratio = gs.length ? gs.filter(g => isDone(g.id, key)).length / gs.length : 0;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "day" + (ratio === 1 ? " full" : "");
    b.setAttribute("aria-pressed", String(key === selected));
    b.setAttribute("aria-label", `${dd.getDate()} de ${MONTHS[dd.getMonth()]}: ${Math.round(ratio * 100)}% cumprido`);
    b.innerHTML = `<span class="fill" style="height:${ratio * 100}%"></span><span class="wd">${i === 0 ? "hoje" : WEEKDAYS[dd.getDay()]}</span><span class="dn">${dd.getDate()}</span>`;
    b.onclick = () => { selected = key; render(); };
    week.append(b);
  }

  const list = document.getElementById("list");
  list.replaceChildren();
  document.getElementById("empty").hidden = state.goals.length > 0;
  for (const g of goals) {
    const total = totalDays(g.id), s = streak(g.id), checked = isDone(g.id, selected);
    const li = document.createElement("li");
    li.className = "goal" + (checked ? " done" : "");
    li.innerHTML = `
      <button class="check" type="button" aria-pressed="${checked}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="info">
        <div class="name"></div>
        <div class="progress"><i style="width:${Math.min(100, total / g.target * 100)}%"></i></div>
        <div class="meta">
          <span>${Math.min(total, g.target)} de ${g.target} dias</span>
          ${s > 1 ? `<span class="streak">${s} dias seguidos</span>` : ""}
          ${total >= g.target ? `<span class="badge">Meta cumprida</span>` : ""}
        </div>
      </div>
      <button class="remove" type="button">Remover</button>`;
    li.querySelector(".name").textContent = g.name;
    const check = li.querySelector(".check");
    check.setAttribute("aria-label", `${checked ? "Desmarcar" : "Marcar"} ${g.name}`);
    check.onclick = () => toggle(g.id);
    const rm = li.querySelector(".remove");
    rm.onclick = () => {
      if (!rm.classList.contains("armed")) {
        rm.classList.add("armed"); rm.textContent = "Confirmar?";
        setTimeout(() => { rm.classList.remove("armed"); rm.textContent = "Remover"; }, 3000);
        return;
      }
      removeGoal(g.id);
    };
    list.append(li);
  }
  if (state.goals.length && !goals.length) {
    const li = document.createElement("li");
    li.className = "hint";
    li.textContent = "Nenhum objetivo existia neste dia.";
    list.append(li);
  }
}

/* ---------- ações ---------- */
function toggle(goalId) {
  const ids = new Set(doneOn(selected));
  ids.has(goalId) ? ids.delete(goalId) : ids.add(goalId);
  if (ids.size) state.days[selected] = [...ids]; else delete state.days[selected];
  changed();
}
function addGoal(name, target) {
  name = name.trim();
  if (!name) return;
  const earliest = keyOf(new Date()) < selected ? keyOf(new Date()) : selected;
  state.goals.push({ id: uid(), name, target: Math.max(1, Math.min(3650, target || 30)), createdAt: shift(earliest, -6) });
  changed();
}
function removeGoal(goalId) {
  state.goals = state.goals.filter(g => g.id !== goalId);
  for (const k of Object.keys(state.days)) {
    const ids = state.days[k].filter(id => id !== goalId);
    if (ids.length) state.days[k] = ids; else delete state.days[k];
  }
  changed();
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("goalName"), target = document.getElementById("goalTarget");
  addGoal(name.value, parseInt(target.value, 10));
  name.value = "";
  name.focus();
});
const chips = document.getElementById("chips");
for (const [name, target] of SUGGESTIONS) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = `${name} · ${target} dias`;
  b.onclick = () => addGoal(name, target);
  chips.append(b);
}

/* ---------- salvamento ---------- */
const statusEl = document.getElementById("status");
let saving = false, dirty = false, timer = null;

function changed() {
  render();
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(flush, 400);
}
async function flush() {
  if (!store || saving || !dirty) return;
  saving = true; dirty = false;
  try {
    await store.save(JSON.parse(JSON.stringify(state)));
    statusEl.textContent = store.note;
  } catch (err) {
    statusEl.textContent = err?.code === "quota_exceeded"
      ? "Espaço cheio: remova objetivos antigos para continuar salvando."
      : "Não foi possível salvar agora. Tente marcar de novo em instantes.";
  } finally {
    saving = false;
    if (dirty) flush();
  }
}

function localStore() {
  const KEY = "metas-do-dia";
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  return {
    note: "Salvo só neste navegador.",
    initial: data,
    save: async s => { localStorage.setItem(KEY, JSON.stringify(s)); }
  };
}

function apply(data) {
  if (!data || dirty || saving) return;
  state = { goals: Array.isArray(data.goals) ? data.goals : [], days: data.days && typeof data.days === "object" ? data.days : {} };
  render();
}

async function start() {
  render();
  let db = null, id = null;
  try {
    if (window.claude?.use) {
      db = await window.claude.use("db");
      const user = await window.claude.use("user");
      id = user ? await user.id() : null;
    }
  } catch {}

  if (db && id) {
    const ref = db.doc(`data/users/${id}/state`);
    store = { note: "Salvo na sua conta.", save: s => ref.set(s) };
    ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists) apply(snap.data());
      statusEl.textContent = store.note;
    }, () => { statusEl.textContent = "A sincronização parou. Recarregue a página."; });
  } else {
    store = localStore();
    apply(store.initial);
    statusEl.textContent = store.note;
  }
  if (dirty) flush();
}
start();
</script>
